# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output with the ANKA theme (final37.md §2 + §3):
# yeşil zemin + krem/turuncu yazı + Türkçe glyph'li anka-tr fontları.
# Yollar ROOT-göreli mutlak: grub-mkstandalone EFI'sinde ${prefix}
# (memdisk)'e işaret eder; grub-embed.cfg root'u ISO birimine ayarladığı
# için /boot/... mutlak yolları ISO üzerinden çözülür.
insmod all_video
insmod gfxterm
insmod png
loadfont /boot/grub/themes/anka/anka-tr.pf2
loadfont /boot/grub/themes/anka/anka-tr-44.pf2
set gfxmode="auto"
set theme="/boot/grub/themes/anka/theme.txt"
export theme
terminal_input console
terminal_output gfxterm

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=archlinux
timeout=15
timeout_style=menu


# Menu entries
# final37 §3: menü metinleri Türkçe ("ortamı" — ı/ş/ğ glyph'ları anka-tr
# fontunda hazır; ASCII'ye KAÇMA YOK)

menuentry "Yerinde ANKA kurulum ortamı (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Yerinde ANKA ekran okuyuculu kurulum ortamı - speakup (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G accessibility=on
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memtest86+ çalıştır (RAM testi)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Memtest86+ çalıştır (RAM testi)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == 'i386' -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    elif [ "${grub_cpu}" == 'arm64' -a -f '/shellaa64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellaa64.efi
        }
    elif [ "${grub_cpu}" == 'riscv64' -a -f '/shellriscv64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellriscv64.efi
        }
    elif [ "${grub_cpu}" == 'loongarch64' -a -f '/shellloongarch64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellloongarch64.efi
        }
    fi

    menuentry 'UEFI Ürün Yazılımı Ayarları' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Sistemi kapat' --class shutdown --class poweroff {
    echo 'Sistem kapatılıyor...'
    halt
}

menuentry 'Sistemi yeniden başlat' --class reboot --class restart {
    echo 'Sistem yeniden başlatılıyor...'
    reboot
}


# GRUB init tune for accessibility
play 600 988 1 1319 4
