---
initialSwapChoice: none
defaultFileSystemType: ext4
drawNestedPartitions: false
alwaysShowPartitionButtons: false
allowManualPartitioning: true
allowToggleReuse: false
# final61: gerçek kurulum boyutu ~12GB (usr 8.8G) — 40 eski/büyük değerdi ve
# Windows yanında kalan ~15GB boş alanda elle bölümlemeyi ENGELLİYORDU.
# 15 = 12GB kurulum + ESP + swap + marj; 35GB Windows + 50GB disk senaryosu açılır.
requiredStorage: 15
