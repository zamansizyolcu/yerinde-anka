---
# Kurulum sonunda canlı ortamda root olarak çalışır (dontChroot: true).
# Tüm mantık /usr/local/bin/yerinde-finalize.sh içinde taşındı; burada
# sadece script çağrılır. ${ROOT} kurulum sihirbazının tanımlı makrosudur, başka
# değişken YOK (tanımsız değişken hatasını önler).
dontChroot: true
timeout: 600
script:
  - /usr/local/bin/yerinde-finalize.sh ${ROOT}
