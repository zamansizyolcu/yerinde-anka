---
# final64 §1: Bu dosya bir ara 'extraMounts:' BOŞ bırakılmıştı; Calamares
# mount modülü boş listeyi "varsayılanı sıfırla" diye yorumlar (main.py:
# extra_mounts = configuration.get("extraMounts") or []). Sonuç: /proc /sys
# /dev hedefe bağlanmaz, users/displaymanager chroot işlemleri ve umount
# modülü güvenilmez hale gelir. Yukarı akış varsayılanı GERİ getirildi.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
