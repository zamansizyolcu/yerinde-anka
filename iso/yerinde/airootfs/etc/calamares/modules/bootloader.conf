# final59.md §1 — UEFI çift ESP: GRUB her senaryoda önde
# bootloader(grub) modülü yapılandırması. Elle bölümlemede 2. ESP'ye kurulan
# GRUB'un firmware tarafından bulunamaması sorunu için:
#   - installEFIFallback: true → seçilen ESP'ye \EFI\BOOT\BOOTX64.EFI yazılır
#     (NVRAM girdisi olmayan/arkada kalan firmware'ler bu fallback yolu yükler).
#   - grub-install'a --no-nvram ASLA verilmez (yerinde-finalize.sh ile uyumlu);
#     NVRAM girdisi + boot order ilk açılışta yerinde-grub-varsayilan.service
#     tarafından garanti altına alınır.
# Not: ISO akışı bootloader modülünü kullanmasa bile (GRUB'u
# yerinde-finalize.sh kurar) bu config, modül devreye girse doğru davranacak
# şekilde sabitlenir; doğrulama: grep installEFIFallback → true.
---
efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# final13/final37: ANKA kimliği (finalize ile aynı)
efiBootloaderId: "YerindeANKA"

installEFIFallback: true
installHybridGRUB: false
