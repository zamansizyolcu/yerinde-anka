---
# final73 §2: unpackfs'ten ÖNCE çalışan sfs köprüsü (dontChroot=true →
# canlı sistemde root). Tüm mantık /usr/local/bin/yerinde-sfs-kopru.sh
# içinde; burada sadece çağrılır. Betik kaynak bulamazsa exit 1 ile
# çıkar → Calamares net hata ile DURUR (şifreli %2 hatası yok).
dontChroot: true
timeout: 120
script:
  - /usr/local/bin/yerinde-sfs-kopru.sh
