# final27.md §2 (cacyhos paritesi): ydotoold — /run/ydotool.socket
# 0660 + uinput grubu. Group=uinput soketin sahibi grubunu belirler
# (sayısal gid'den bağımsız); --socket-perm=0660 tam modu verir.
# Asistan kullanıcısı, kurulumda finalize'in usermod -aG uinput,input
# adımıyla gruba alınır → sesli "fareyi oynat"/"yaz" komutları çalışır.
[Service]
Group=uinput
ExecStart=
ExecStart=/usr/bin/ydotoold --socket-path=/run/ydotool.socket --socket-perm=0660
