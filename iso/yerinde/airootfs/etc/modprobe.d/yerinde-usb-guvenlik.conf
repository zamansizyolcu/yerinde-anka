# final64 §2: SHARGE NVMe köprüsü (2d01:d709) UAS altında veriyolundan
# kopabiliyor (kernel kanıtı: 'usb 4-4: USB disconnect' + Synchronize
# Cache(10) DID_ERROR). Bu cihazı BOT moduna zorla (usb-storage devralır);
# kurulum sırasında GB'larca kesintisiz yazım için gerekli.
options usb-storage quirks=2d01:d709:u
